{
"name": "Build Android APK",
"on": ["push", "workflow_dispatch"],
"jobs": {
"build": {
"runs-on": "ubuntu-latest",
"steps": [
{
"name": "Checkout repository",
"uses": "actions/checkout@v4"
},
{
"name": "Setup Node.js",
"uses": "actions/setup-node@v4",
"with": {
"node-version": "18"
}
},
{
"name": "Install dependencies",
"run": "npm install --legacy-peer-deps"
},
{
"name": "Generate Native Android project",
"run": "npx expo prebuild --platform android --clean"
},
{
"name": "Setup Java 17",
"uses": "actions/setup-java@v4",
"with": {
"distribution": "zulu",
"java-version": "17"
}
},
{
"name": "Ensure Signing Keystore Exists",
"working-directory": "android/app",
"run": "test -f debug.keystore || keytool -genkeypair -v -storetype PKCS12 -keystore debug.keystore -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname CN=Android,O=Android,C=US"
},
{
"name": "Build Standalone Release APK",
"working-directory": "android",
"run": "./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a -Dorg.gradle.jvmargs=-Xmx4096m"
},
{
"name": "Upload APK Artifact",
"uses": "actions/upload-artifact@v4",
"with": {
"name": "Bhagadbilla-Release-APK",
"path": "android/app/build/outputs/apk/release/app-release.apk"
}
}
]
}
}
}
